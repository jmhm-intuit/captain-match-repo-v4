<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1769ff" />
    <meta name="description" content="Shared multi-team 7v7 soccer coach planner with local backup and Supabase cloud snapshot sync." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Coach Planner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Coach Planner v7.04 - Cloud Snapshot MVP</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
    <link rel="stylesheet" href="./src/styles.css" />
    <style>
      .pwa-install-button {
        position: fixed;
        right: 18px;
        bottom: 88px;
        z-index: 1000;
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        background: linear-gradient(135deg, #1769ff, #0b3f9c);
        color: #fff;
        font: 800 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        box-shadow: 0 14px 32px rgba(23, 105, 255, .28);
        cursor: pointer;
      }
      .pwa-install-button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button id="installPwaButton" class="pwa-install-button" hidden>Install app</button>
    <script src="./cloud-config.js"></script>
    <script src="./src/app.js"></script>
    <script>
      (function () {
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('./service-worker.js').catch(function (error) {
              console.warn('Service worker registration failed.', error);
            });
          });
        }

        var deferredInstallPrompt = null;
        var installButton = document.getElementById('installPwaButton');
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (isStandalone && installButton) installButton.hidden = true;

        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          deferredInstallPrompt = event;
          if (installButton) installButton.hidden = false;
        });

        if (installButton) {
          installButton.addEventListener('click', function () {
            if (!deferredInstallPrompt) return;
            installButton.hidden = true;
            deferredInstallPrompt.prompt();
            deferredInstallPrompt.userChoice.finally(function () {
              deferredInstallPrompt = null;
            });
          });
        }

        window.addEventListener('appinstalled', function () {
          if (installButton) installButton.hidden = true;
          deferredInstallPrompt = null;
        });
      })();
    </script>
  </body>
</html>
